<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Unity WebGL Player | Air Wars 3</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #231F20;
      font-family: Helvetica, Arial, sans-serif;
    }
    #unityContainer {
      width: 100%; height: 100%;
      position: absolute; left: 0; top: 0;
    }
    #unityContainer canvas {
      width: 100%; height: 100%; background: #231F20;
    }
    #boot {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      color: #fff; text-align: center; z-index: 5;
    }
    #boot .title { font-size: 18px; font-weight: bold; margin-bottom: 14px; }
    #bootBar {
      width: 220px; height: 10px; margin: 0 auto;
      background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden;
    }
    #bootFill {
      width: 0%; height: 100%; background: #19a0ff; border-radius: 5px;
      transition: width 0.12s ease;
    }
    #bootInfo {
      margin-top: 10px; font-size: 12px; color: rgba(255,255,255,0.65);
      max-width: 280px; margin-left: auto; margin-right: auto; line-height: 1.4;
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="title">Air Wars 3</div>
    <div id="bootBar"><div id="bootFill"></div></div>
    <div id="bootInfo">Preparing…</div>
  </div>
  <div id="unityContainer"></div>

  <script src="Build/UnityLoader.js"></script>
  <script>
(function () {
  // Full data file from GitHub Release (avoids 100MB repo limit + browser merge)
  var RELEASE_DATA_URL = 'https://github.com/VexaCloud/air-wars-3/releases/download/v1.0.0/AirWars3-158.data.unityweb';

  var DATA_NAME = 'AirWars3-158.data.unityweb';
  var PARTS = [
    'Build/AirWars3-158.data.unityweb.part00',
    'Build/AirWars3-158.data.unityweb.part01',
    'Build/AirWars3-158.data.unityweb.part02'
  ];
  var JSON_URL = 'Build/AirWars3-158.json';

  var bootFill = document.getElementById('bootFill');
  var bootInfo = document.getElementById('bootInfo');
  var boot = document.getElementById('boot');
  var dataBlobUrl = null;

  function setBoot(pct, msg) {
    bootFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
    if (msg) bootInfo.textContent = msg;
  }
  function hideBoot() { boot.style.display = 'none'; }

  function installUrlPatch(fromSubstr, toUrl) {
    var origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url) {
      var args = Array.prototype.slice.call(arguments);
      if (typeof url === 'string' && url.indexOf(fromSubstr) !== -1 && url.indexOf('.part') === -1) {
        args[1] = toUrl;
      }
      return origOpen.apply(this, args);
    };
    var origFetch = window.fetch;
    window.fetch = function (input, init) {
      var url = typeof input === 'string' ? input : (input && input.url);
      if (typeof url === 'string' && url.indexOf(fromSubstr) !== -1 && url.indexOf('.part') === -1) {
        return origFetch.call(this, toUrl, init);
      }
      return origFetch.apply(this, arguments);
    };
  }

  function fetchWithProgress(url, onProgress) {
    return fetch(url, { cache: 'force-cache' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status + ' for ' + url);
      var total = Number(res.headers.get('Content-Length')) || 0;
      if (!res.body || !res.body.getReader) {
        return res.arrayBuffer();
      }
      var reader = res.body.getReader();
      var chunks = [];
      var received = 0;
      function pump() {
        return reader.read().then(function (result) {
          if (result.done) {
            var out = new Uint8Array(received);
            var off = 0;
            for (var i = 0; i < chunks.length; i++) {
              out.set(chunks[i], off);
              off += chunks[i].byteLength;
            }
            return out.buffer;
          }
          chunks.push(result.value);
          received += result.value.byteLength;
          if (onProgress) onProgress(received, total);
          return pump();
        });
      }
      return pump();
    });
  }

  function tryReleaseData() {
    setBoot(2, 'Downloading data…');
    return fetchWithProgress(RELEASE_DATA_URL, function (received, total) {
      if (total > 0) {
        setBoot(2 + (received / total) * 70, 'Data ' + Math.round(received / total * 100) + '%');
      } else {
        setBoot(20, 'Downloading data… ' + Math.round(received / 1048576) + ' MB');
      }
    }).then(function (buf) {
      var u8 = new Uint8Array(buf);
      var header = String.fromCharCode.apply(null, u8.subarray(0, 15));
      if (header !== 'UnityWebData1.0') {
        throw new Error('Release data bad header: ' + header);
      }
      dataBlobUrl = URL.createObjectURL(new Blob([buf], { type: 'application/octet-stream' }));
      return dataBlobUrl;
    }).catch(function (err) {
      console.warn('Release data failed, falling back to parts:', err);
      return null;
    });
  }

  function mergeParts() {
    setBoot(0, 'Downloading data parts…');
    var loaded = 0;
    return Promise.all(PARTS.map(function (url) {
      return fetch(url, { cache: 'force-cache' }).then(function (res) {
        if (!res.ok) throw new Error('Failed ' + url + ' (' + res.status + ')');
        return res.arrayBuffer().then(function (buf) {
          loaded++;
          setBoot((loaded / PARTS.length) * 70, 'Data part ' + loaded + '/' + PARTS.length);
          return buf;
        });
      });
    })).then(function (buffers) {
      setBoot(75, 'Merging…');
      var total = 0;
      for (var i = 0; i < buffers.length; i++) total += buffers[i].byteLength;
      var out = new Uint8Array(total);
      var offset = 0;
      for (var j = 0; j < buffers.length; j++) {
        out.set(new Uint8Array(buffers[j]), offset);
        offset += buffers[j].byteLength;
      }
      var header = String.fromCharCode.apply(null, out.subarray(0, 15));
      if (header !== 'UnityWebData1.0') throw new Error('Merged data corrupt');
      dataBlobUrl = URL.createObjectURL(new Blob([out], { type: 'application/octet-stream' }));
      return dataBlobUrl;
    });
  }

  function probeLocalFull() {
    return fetch('Build/' + DATA_NAME, { method: 'HEAD', cache: 'no-store' })
      .then(function (r) { return r.ok; })
      .catch(function () { return false; });
  }

  function startUnity() {
    setBoot(80, 'Loading engine…');
    UnityLoader.instantiate('unityContainer', JSON_URL, {
      onProgress: function (instance, progress) {
        if (progress >= 1) {
          setBoot(100, 'Starting…');
          setTimeout(hideBoot, 250);
        } else if (progress >= 0.9) {
          setBoot(90 + (progress - 0.9) * 100, 'Compiling (tab may freeze 1–3 min)…');
        } else {
          setBoot(80 + progress * 10, Math.round(progress * 100) + '%');
        }
      }
    });
  }

  function boot() {
    if (typeof UnityLoader === 'undefined') {
      bootInfo.textContent = 'Error: UnityLoader.js missing';
      return;
    }
    probeLocalFull().then(function (hasLocal) {
      if (hasLocal) {
        startUnity();
        return;
      }
      return tryReleaseData().then(function (blobUrl) {
        if (blobUrl) {
          installUrlPatch(DATA_NAME, blobUrl);
          startUnity();
          return;
        }
        return mergeParts().then(function (blobUrl2) {
          installUrlPatch(DATA_NAME, blobUrl2);
          startUnity();
        });
      });
    }).catch(function (err) {
      bootInfo.textContent = 'Error: ' + (err && err.message ? err.message : err);
      console.error(err);
    });
  }

  boot();
})();
  </script>
</body>
</html>
