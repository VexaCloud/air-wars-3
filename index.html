<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
  <title>Unity WebGL Player | Air Wars 3</title>
  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%;
      overflow: hidden; background: #231F20;
      font-family: Helvetica, Arial, sans-serif;
    }
    #unityContainer {
      width: 100%; height: 100%;
      position: absolute; left: 0; top: 0;
    }
    #unityContainer canvas {
      width: 100%; height: 100%; background: #231F20;
    }
    #boot {
      position: absolute; left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      color: #fff; text-align: center; z-index: 5;
    }
    #boot .title { font-size: 18px; font-weight: bold; margin-bottom: 14px; }
    #bootBar {
      width: 200px; height: 10px; margin: 0 auto;
      background: rgba(255,255,255,0.2); border-radius: 5px; overflow: hidden;
    }
    #bootFill {
      width: 0%; height: 100%; background: #19a0ff; border-radius: 5px;
      transition: width 0.15s ease;
    }
    #bootInfo {
      margin-top: 10px; font-size: 12px; color: rgba(255,255,255,0.65);
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="title">Air Wars 3</div>
    <div id="bootBar"><div id="bootFill"></div></div>
    <div id="bootInfo">Preparing…</div>
  </div>
  <div id="unityContainer"></div>

  <script src="Build/UnityLoader.js"></script>
  <script>
(function () {
  (function removeSiteLockAndMockSDK() {
    var fakeUrl = 'https://www.crazygames.com/game/air-wars-3';
    var fakeLoc = {
      href: fakeUrl, protocol: 'https:', host: 'www.crazygames.com',
      hostname: 'www.crazygames.com', port: '', pathname: '/game/air-wars-3',
      search: '', hash: '', origin: 'https://www.crazygames.com',
      toString: function () { return fakeUrl; },
      assign: function () {}, replace: function () {}, reload: function () {}
    };
    try {
      Object.defineProperty(document, 'URL', { get: function () { return fakeUrl; }, configurable: true });
      Object.defineProperty(document, 'documentURI', { get: function () { return fakeUrl; }, configurable: true });
    } catch (e) {}
    try {
      var desc = Object.getOwnPropertyDescriptor(window, 'location');
      if (desc && desc.configurable) {
        Object.defineProperty(window, 'location', { get: function () { return fakeLoc; }, configurable: true });
      }
    } catch (e) {}

    window.Crazygames = {
      init: function (opts) {
        if (opts && opts.crazySDKObjectName && typeof SendMessage === 'function') {
          try { SendMessage(opts.crazySDKObjectName, 'InitCallback', 'true'); } catch (e) {}
        }
        return true;
      },
      happytime: function () {},
      gameplayStart: function () {},
      gameplayStop: function () {},
      requestAd: function () {
        if (typeof SendMessage === 'function') {
          try { SendMessage('CrazySDK', 'AdFinished', ''); } catch (e) {}
        }
      },
      requestBanners: function () {},
      requestInviteUrl: function () {},
      screenshotReceived: function () {},
      isInstantGame: function () { return false; },
      getUserInfo: function () { return {}; }
    };
  })();
   (function installPhotonAppIdOverride() {
    var APP_ID = 'c9b4e40b-41ea-4e3d-90a1-24ffe1df1584';
    var APPID_BODY = APP_ID + '~us~161~https://localhost/';
    var LOGIN_OK = 'Guest';
    var OK = 'OK';

    function whichEndpoint(url) {
      if (typeof url !== 'string') return null;
      var u = url.toLowerCase();
      if (u.indexOf('photonengine') !== -1 || u.indexOf('exitgames') !== -1) return null;
      if (u.indexOf('getphotonappid') !== -1 || u.indexOf('php3/getphoton') !== -1) return 'appid';
      if (u.indexOf('playerlogin') !== -1 || u.indexOf('login.php') !== -1) return 'login';
      if (u.indexOf('martiangames.com') !== -1 || u.indexOf('/php3/') !== -1 ||
          (u.indexOf('.php') !== -1 && (u.indexOf('games') !== -1 || u.indexOf('airwars') !== -1)))
        return 'other';
      return null;
    }

    function bodyFor(kind) {
      if (kind === 'appid') return APPID_BODY;
      if (kind === 'login') return LOGIN_OK;
      return OK;
    }

    function toAB(text) {
      var bytes = new TextEncoder().encode(text);
      var ab = new ArrayBuffer(bytes.length);
      new Uint8Array(ab).set(bytes);
      return { ab: ab, text: text, len: bytes.length };
    }

    var _fetch = window.fetch;
    window.fetch = function (input, init) {
      var url = typeof input === 'string' ? input : (input && input.url);
      var kind = whichEndpoint(url);
      if (kind) {
        return Promise.resolve(new Response(bodyFor(kind), {
          status: 200, statusText: 'OK',
          headers: { 'Content-Type': 'text/plain; charset=utf-8' }
        }));
      }
      return _fetch.apply(this, arguments);
    };

    var _open = XMLHttpRequest.prototype.open;
    var _send = XMLHttpRequest.prototype.send;
    var _setRequestHeader = XMLHttpRequest.prototype.setRequestHeader;

    XMLHttpRequest.prototype.open = function (method, url) {
      this.__aw3url = url;
      return _open.apply(this, arguments);
    };
    XMLHttpRequest.prototype.setRequestHeader = function (k, v) {
      if (whichEndpoint(this.__aw3url)) return;
      return _setRequestHeader.apply(this, arguments);
    };
    XMLHttpRequest.prototype.send = function (body) {
      var url = this.__aw3url;
      var kind = whichEndpoint(url);
      if (!kind) return _send.apply(this, arguments);

      var self = this;
      var payload = toAB(bodyFor(kind));
      setTimeout(function () {
        var wantsAB = self.responseType === 'arraybuffer';
        try {
          Object.defineProperty(self, 'readyState', { configurable: true, get: function () { return 4; } });
          Object.defineProperty(self, 'status', { configurable: true, get: function () { return 200; } });
          Object.defineProperty(self, 'statusText', { configurable: true, get: function () { return 'OK'; } });
          Object.defineProperty(self, 'response', { configurable: true, get: function () { return wantsAB ? payload.ab : payload.text; } });
          Object.defineProperty(self, 'responseText', { configurable: true, get: function () { return payload.text; } });
          Object.defineProperty(self, 'responseURL', { configurable: true, get: function () { return url; } });
        } catch (e) {
          self.readyState = 4; self.status = 200; self.statusText = 'OK';
          self.response = wantsAB ? payload.ab : payload.text;
          self.responseText = payload.text;
        }
        self.getAllResponseHeaders = function () {
          return 'content-type: text/plain; charset=utf-8\r\ncontent-length: ' + payload.len + '\r\n';
        };
        self.getResponseHeader = function (name) {
          name = (name || '').toLowerCase();
          if (name === 'content-type') return 'text/plain; charset=utf-8';
          if (name === 'content-length') return String(payload.len);
          return null;
        };
        if (typeof self.onreadystatechange === 'function') try { self.onreadystatechange(); } catch (e) {}
        if (typeof self.onload === 'function') try { self.onload({}); } catch (e) {}
        if (typeof self.onloadend === 'function') try { self.onloadend({}); } catch (e) {}
      }, 10);
    };
  })();

  var DATA_NAME = 'AirWars3-158.data.unityweb';
  var PARTS = [
    'Build/AirWars3-158.data.unityweb.part00',
    'Build/AirWars3-158.data.unityweb.part01',
    'Build/AirWars3-158.data.unityweb.part02'
  ];
  var JSON_URL = 'Build/AirWars3-158.json';

  var bootFill = document.getElementById('bootFill');
  var bootInfo = document.getElementById('bootInfo');
  var boot = document.getElementById('boot');
  var dataBlobUrl = null;

  function setBoot(pct, msg) {
    bootFill.style.width = Math.max(0, Math.min(100, pct)) + '%';
    if (msg) bootInfo.textContent = msg;
  }

  function hideBoot() {
    boot.style.display = 'none';
  }

  function probeFullData() {
    return fetch('Build/' + DATA_NAME, { headers: { Range: 'bytes=0-14' }, cache: 'no-store' })
      .then(function (r) {
        if (!r.ok || !r.body) return false;
        var reader = r.body.getReader();
        return reader.read().then(function (chunk) {
          reader.cancel();               // never pull the whole 100 MB just to probe
          var v = chunk.value;
          return !!v && v.length >= 15 &&
            String.fromCharCode.apply(null, v.subarray(0, 15)) === 'UnityWebData1.0';
        });
      })
      .catch(function () { return false; });
  }

  function mergeParts() {
    setBoot(0, 'Downloading data parts…');
    var loaded = 0;
    var totalHint = PARTS.length;

    return Promise.all(PARTS.map(function (url, index) {
      return fetch(url, { cache: 'force-cache' }).then(function (res) {
        if (!res.ok) throw new Error('Failed to fetch ' + url + ' (' + res.status + ')');
        return res.arrayBuffer().then(function (buf) {
          loaded++;
          setBoot((loaded / totalHint) * 90, 'Data part ' + loaded + '/' + totalHint);
          return buf;
        });
      });
    })).then(function (buffers) {
      setBoot(92, 'Merging data…');
      var header = String.fromCharCode.apply(null, new Uint8Array(buffers[0], 0, 15));
      if (header !== 'UnityWebData1.0') {
        throw new Error('Merged data is corrupt (bad header: ' + header + ')');
      }
      dataBlobUrl = URL.createObjectURL(new Blob(buffers, { type: 'application/octet-stream' }));
      setBoot(96, 'Starting Unity…');
      return dataBlobUrl;
    });
  }

  function installDataPatch(blobUrl) {
    var origOpen = XMLHttpRequest.prototype.open;
    XMLHttpRequest.prototype.open = function (method, url) {
      var args = Array.prototype.slice.call(arguments);
      if (typeof url === 'string' &&
          url.indexOf(DATA_NAME) !== -1 &&
          url.indexOf('.part') === -1) {
        args[1] = blobUrl;
      }
      return origOpen.apply(this, args);
    };

    var origFetch = window.fetch;
    window.fetch = function (input, init) {
      var url = typeof input === 'string' ? input : (input && input.url);
      if (typeof url === 'string' &&
          url.indexOf(DATA_NAME) !== -1 &&
          url.indexOf('.part') === -1) {
        return origFetch.call(this, blobUrl, init);
      }
      return origFetch.apply(this, arguments);
    };
  }

  function startUnity() {
    if (typeof UnityLoader === 'undefined') {
      bootInfo.textContent = 'Error: UnityLoader.js failed to load';
      return;
    }
    var unityInstance = UnityLoader.instantiate(
      'unityContainer',
      JSON_URL,
      {
        onProgress: function (instance, progress) {
          var pct = 96 + progress * 4;
          setBoot(pct, progress >= 1 ? 'Starting…' :
                          progress >= 0.9 ? 'Initializing game…' :
                          Math.round(progress * 100) + '%');
          if (progress >= 1) {
            setTimeout(hideBoot, 300);
          }
        }
      }
    );
  }

  // Boot sequence
  probeFullData().then(function (hasFull) {
    if (hasFull) {
      setBoot(50, 'Loading…');
      startUnity();
      return;
    }
    return mergeParts().then(function (blobUrl) {
      installDataPatch(blobUrl);
      startUnity();
    });
  }).catch(function (err) {
    bootInfo.textContent = 'Error: ' + (err && err.message ? err.message : err);
    console.error(err);
  });
})();
  </script>
</body>
</html>
